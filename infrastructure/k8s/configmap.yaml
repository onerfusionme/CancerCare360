apiVersion: v1
kind: ConfigMap
metadata:
  name: cancercare-config
  namespace: cancercare360
  labels:
    app.kubernetes.io/name: cancercare360
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT_BACKEND: "3001"
  PORT_FRONTEND: "3000"
  PORT_AI_SERVICE: "8000"
  ENABLE_FEATURE_X: "true"
  DB_HOST: "postgres.cancercare360.svc.cluster.local"
  DB_PORT: "5432"
  REDIS_HOST: "redis.cancercare360.svc.cluster.local"
  REDIS_PORT: "6379"
  ELASTICSEARCH_HOST: "http://elasticsearch.cancercare360.svc.cluster.local:9200"
  MINIO_ENDPOINT: "minio.cancercare360.svc.cluster.local"
  MINIO_PORT: "9000"
  KEYCLOAK_URL: "https://auth.cancercare360.com"

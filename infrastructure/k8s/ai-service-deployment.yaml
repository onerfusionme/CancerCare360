apiVersion: apps/v1
kind: Deployment
metadata:
  name: cancercare-ai-service
  namespace: cancercare360
  labels:
    app: cancercare-ai-service
    app.kubernetes.io/component: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cancercare-ai-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cancercare-ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ai-service
          image: cancercare360/ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cancercare-config
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cancercare-ai-service
  namespace: cancercare360
  labels:
    app: cancercare-ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: cancercare-ai-service
